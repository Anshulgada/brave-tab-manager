minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ty
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false
        files: ^(src|tests|scripts)/.*\.py$|^pyproject\.toml$

      - id: biome
        name: Biome check
        entry: bun --cwd extension run check
        language: system
        pass_filenames: false
        files: ^extension/

      - id: typescript
        name: TypeScript type check
        entry: bun --cwd extension run typecheck
        language: system
        pass_filenames: false
        files: ^extension/

      - id: detect-secrets
        name: Detect secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^(uv\.lock|extension/bun\.lock)$

      - id: path-filtered-gates
        name: Path-filtered build and test gates
        entry: uv run python scripts/pre_push.py
        language: system
        pass_filenames: false
        stages: [pre-push]
