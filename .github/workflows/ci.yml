name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.6

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify synchronized versions
        run: uv run python scripts/check_versions.py

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest

      - name: Security scan
        run: uv run bandit -q -r src

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: extension/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        working-directory: extension
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        working-directory: extension
        run: bun run check

      - name: Type check
        working-directory: extension
        run: bun run typecheck

      - name: Test
        working-directory: extension
        run: bun run test

      - name: Build
        working-directory: extension
        run: bun run build

      - name: Create sideload archive
        working-directory: extension
        run: bun run zip

      - name: Read package version
        id: package-version
        working-directory: extension
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload sideload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tabman-extension-${{ steps.package-version.outputs.version }}
          path: extension/output/*.zip
          if-no-files-found: error

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Lint the workflow files
        uses: docker://rhysd/actionlint:1.7.12

      - name: Audit the workflow files
        run: uvx zizmor@1.31.1 --persona=regular --min-severity=medium .github/workflows
