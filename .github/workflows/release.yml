name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.6

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$tag" = "$version"

      - name: Test
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  extension:
    name: Extension archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: extension/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        working-directory: extension
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: extension
        run: bun run typecheck

      - name: Test
        working-directory: extension
        run: bun run test

      - name: Build and zip
        working-directory: extension
        run: bun run zip

      - name: Upload extension archive
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: extension/output/tabmanextension-*-chrome.zip
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: python
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tabman
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    name: GitHub Release
    needs: [python, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Add install scripts
        run: |
          cp scripts/install.ps1 release-assets/
          cp scripts/install.sh release-assets/
          cp scripts/install-extension.ps1 release-assets/
          cp scripts/install-extension.sh release-assets/

      - name: Add stable extension archive name
        run: |
          for archive in release-assets/tabmanextension-[0-9]*.zip; do
            cp "$archive" release-assets/tabmanextension-latest-chrome.zip
            break
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
