name: Release and Publish (PyPI)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI"
        required: true
        type: boolean
        default: true
      create_github_release:
        description: "Create GitHub Release (requires matching git tag)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.14.6

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$tag" = "$version"

      - name: Test
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  extension:
    name: Extension archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: extension/.node-version
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: true

      - name: Install dependencies
        working-directory: extension
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: extension
        run: bun run typecheck

      - name: Test
        working-directory: extension
        run: bun run test

      - name: Build and zip
        working-directory: extension
        run: bun run zip

      - name: Upload extension archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-dist
          path: extension/output/tabmanextension-*-chrome.zip
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: python
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tabman
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    name: GitHub Release
    needs: [python, extension]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Add install scripts
        run: |
          cp scripts/install.ps1 release-assets/
          cp scripts/install.sh release-assets/
          cp scripts/install-extension.ps1 release-assets/
          cp scripts/install-extension.sh release-assets/

      - name: Add stable extension archive name
        run: |
          for archive in release-assets/tabmanextension-[0-9]*.zip; do
            cp "$archive" release-assets/tabmanextension-latest-chrome.zip
            break
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
