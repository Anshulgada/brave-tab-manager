name: Feature request
description: An idea for Tabman
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you are trying to do. A request that describes the job is
        easier to build than one that describes a feature.

  - type: textarea
    id: job
    attributes:
      label: What are you trying to do
      description: The workflow you want to end up with
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What do you do today
      description: The workaround you use, if there is one

  - type: textarea
    id: notes
    attributes:
      label: Anything else
